name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and assemble debug APK
        id: android-build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Surface Gradle diagnostics
        if: failure()
        run: |
          if [ -f build.log ]; then
            python3 -c 'from pathlib import Path; import re; text = Path("build.log").read_text(errors="replace"); matches = list(re.finditer(r"FAILURE:.*", text)); start = matches[-1].start() if matches else max(0, len(text) - 3000); output = text[start:start + 3000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::warning title=Gradle failure summary::" + output)'
          fi

      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-diagnostics
          path: build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mirsad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-release:
    name: Publish test APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v8
        with:
          name: mirsad-debug-apk
          path: release

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          مِرْصاد هو تطبيق Android عربي يعرض تغيّرات المجال المغناطيسي التي يقيسها حساس الهاتف.

          **هذا إصدار تجريبي للتثبيت الجانبي فقط.** ملف APK موقّع بمفتاح debug تلقائي، وليس إصدارًا إنتاجيًا موقّعًا للنشر في Google Play.

          **حدود المستشعر:** يعتمد التطبيق على مقياس المجال المغناطيسي المدمج. لا يكشف الذهب أو النحاس أو الألمنيوم مباشرةً، ولا يحدد نوع الجسم أو عمقه. قد تؤثر المغانط والأغطية والشواحن والحديد القريب في القراءات.

          All Credits go to **M-Eleven — Mohamed El-Sayed Abdelfatah**. See [CREDITS.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CREDITS.md) and [LICENSE](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/LICENSE).
          EOF
          gh release create "${GITHUB_REF_NAME}" release/app-debug.apk \
            --verify-tag \
            --prerelease \
            --title "مِرْصاد ${GITHUB_REF_NAME} — APK تجريبي" \
            --notes-file release-notes.md
