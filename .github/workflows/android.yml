name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and assemble debug APK
        id: android-build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Surface Gradle diagnostics
        if: failure()
        run: |
          if [ -f build.log ]; then
            python3 -c 'from pathlib import Path; import re; text = Path("build.log").read_text(errors="replace"); matches = list(re.finditer(r"FAILURE:.*", text)); start = matches[-1].start() if matches else max(0, len(text) - 3000); output = text[start:start + 3000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::warning title=Gradle failure summary::" + output)'
          fi

      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-diagnostics
          path: build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mirsad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
